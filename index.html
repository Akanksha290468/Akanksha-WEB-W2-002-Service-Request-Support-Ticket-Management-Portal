<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Raise Service Request | ServiceDesk</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="request">
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar"><button class="menu-btn" id="menuBtn">☰</button><div><span class="eyebrow">EMPLOYEE PORTAL</span><h1>Raise a Service Request</h1></div><a class="user-chip" href="employee.html">Employee View</a></header>
    <section class="page-wrap">
      <div class="hero-card"><div><span class="eyebrow">SERVICE REQUEST</span><h2>Tell us what you need help with.</h2><p>Submit a request and receive a unique ticket ID instantly.</p></div><div class="hero-icon">＋</div></div>
      <form id="requestForm" class="card form-card" novalidate>
        <div class="section-heading"><div><h2>Request Information</h2><p>Fields marked <b>*</b> are required.</p></div><span class="required-note">Secure internal request</span></div>
        <div id="formMessage" class="message hidden"></div>
        <div class="form-grid">
          <label>Employee Name *<input name="employee" required maxlength="80" placeholder="e.g. Rahul Sharma"></label>
          <label>Employee ID *<input name="employeeId" required maxlength="20" pattern="[A-Za-z0-9-]{3,20}" placeholder="e.g. EMP1024"></label>
          <label>Department *<select name="department" required><option value="">Select department</option><option>IT</option><option>HR</option><option>Finance</option><option>Administration</option><option>Sales</option><option>Operations</option><option>Marketing</option></select></label>
          <label>Email *<input type="email" name="email" required placeholder="name@company.com"></label>
          <label>Request Category *<select name="category" required><option value="">Select category</option><option>IT Support</option><option>Software Access</option><option>Hardware</option><option>HR</option><option>Finance</option><option>Administration</option><option>Other</option></select></label>
          <label>Priority *<select name="priority" required><option value="">Select priority</option><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select></label>
          <label class="full">Subject *<input name="subject" required minlength="5" maxlength="120" placeholder="Short description of your issue"></label>
          <label class="full">Detailed Description *<textarea name="description" required minlength="20" maxlength="1000" rows="6" placeholder="Describe the issue, impact, and any useful details..."></textarea><small class="field-help">20–1000 characters.</small></label>
          <label>Attachment<input type="file" name="attachment" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx"></label>
          <label>Date of Request *<input type="date" name="date" id="requestDate" required></label>
        </div>
        <div class="form-actions"><button type="reset" class="btn btn-secondary">Clear</button><button type="submit" class="btn btn-primary">Submit Request</button></div>
      </form>
    </section>
    <footer class="footer">ServiceDesk • Internal Service Request Portal</footer>
  </main>
</div>
<script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{initLayout(); initRequestForm();});</script>
</body></html>
